<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC Lab">
<meta name="theme-color" content="#F3F5F8">
<title>TOEIC Lab</title>
<link rel="apple-touch-icon" id="touchIcon">
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#1B2A4A; --sub:#66708A; --line:#DFE3EB;
  --pri:#1B2A4A; --pri-ink:#FFFFFF; --soft:#E6EAF3;
  --hl:#FFE066; --hl-ink:#1B2A4A; --loop:#E5484D; --ok:#2E9E6A;
  --miss:rgba(229,72,77,.16); --r:14px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141D; --card:#181E2A; --ink:#E8ECF4; --sub:#97A0B4; --line:#283042;
    --pri:#E8ECF4; --pri-ink:#10141D; --soft:#222A3A; --hl:#6B5A12; --hl-ink:#FFF4C2;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:10px 16px 16px;-webkit-overflow-scrolling:touch}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--loop);outline-offset:2px}
.title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:8px 0 14px}
.title small{font-size:15px;color:var(--sub);font-weight:600;margin-left:6px}
.sub{color:var(--sub);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;align-items:center}.gap{gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:transparent}
.btn.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%;margin-top:10px}
.btn:disabled{opacity:.45}
.btn:active,.icon-btn:active{transform:scale(.96)}
.icon-btn{appearance:none;border:none;background:transparent;color:var(--ink);font-size:18px;min-width:40px;height:40px;border-radius:10px;cursor:pointer;font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(27,42,74,.12)}
.cnt{font-size:12px;opacity:.6;margin-left:2px}
input:not([type=range]):not([type=checkbox]):not([type=file]),textarea,select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{resize:vertical}
.lbl{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.list .item{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px 12px 14px;margin-bottom:8px;cursor:pointer}
.item-main{flex:1;min-width:0}
.item-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:13px;color:var(--sub);margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--sub);margin-left:4px}
.badge.tr{background:var(--hl);color:var(--hl-ink)}
.badge.warn{background:var(--miss);color:var(--loop)}
.star{color:#E9A100}
.empty{color:var(--sub);text-align:center;padding:36px 10px;line-height:1.7}
.notice{background:var(--miss);color:var(--loop);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.link{text-decoration:underline;cursor:pointer;font-weight:700}

/* player */
.player-head{display:flex;align-items:center;gap:4px;margin:2px 0 10px}
.ph-title{flex:1;min-width:0}
.ph-cat{font-size:12px;color:var(--sub);font-weight:700}
.ph-name{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.star-btn{color:var(--line);font-size:22px}.star-btn.on{color:#E9A100}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.sticky{position:sticky;top:0;z-index:5;box-shadow:0 8px 18px -14px rgba(27,42,74,.45)}
.seek{width:100%;accent-color:var(--ink);margin:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:3px}
#loopInfo{color:var(--loop);font-weight:800}
.controls{display:flex;justify-content:center;align-items:center;gap:4px;margin:4px 0 8px}
.play-btn{width:56px;height:56px;border-radius:50%;border:none;background:var(--pri);color:var(--pri-ink);font-size:22px;cursor:pointer;margin:0 6px}
.loop-row{display:flex;gap:6px;justify-content:center}
.loop-row .btn{flex:1;max-width:130px}
.loop-row .btn.set{background:var(--loop);border-color:var(--loop);color:#fff}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--sub)}
.speed-row input{flex:1;accent-color:var(--ink)}
.speed-row b{min-width:44px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.tools-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;gap:8px;flex-wrap:wrap}
.seg-row{display:flex;gap:8px;align-items:flex-start;padding:10px 6px;border-radius:10px;scroll-margin-top:260px}
.seg-row+.seg-row{border-top:1px solid var(--line)}
.seg-row.cur{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.seg-row.cur+.seg-row{border-color:transparent}
.ts{border:none;background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;border-radius:6px;padding:4px 6px;font-variant-numeric:tabular-nums;cursor:pointer;flex-shrink:0;margin-top:3px}
.seg-row.looping .ts{background:var(--loop);color:#fff}
.seg-text{flex:1;line-height:1.65;font-size:16.5px}
.w{cursor:pointer;border-radius:3px}
.w:hover{text-decoration:underline;text-decoration-thickness:2px}
.mini{border:none;background:transparent;font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;color:inherit}

/* shadow & dictation */
.sh-box{min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:16px 8px;margin:12px 0;border-radius:12px;background:var(--bg)}
.sh-phase{font-weight:800;font-size:14px;padding:5px 14px;border-radius:99px;background:var(--soft)}
.sh-phase.speak{background:var(--loop);color:#fff}
.sh-text{font-size:19px;line-height:1.55;font-weight:650}
.sh-meta{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.diff{line-height:2;margin-top:10px}
.diff span{padding:1px 4px;border-radius:4px;margin-right:2px}
.d-miss{background:var(--miss);color:var(--loop);font-weight:700}
.d-extra{color:var(--sub);text-decoration:line-through}
.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}

/* words */
.pos{font-size:12px;color:var(--sub);font-weight:600;margin-left:4px}
.boxes{font-size:9px;letter-spacing:1px;color:var(--ok);flex-shrink:0;margin-left:6px}
.w-more{display:none;margin-top:10px;font-size:14px;line-height:1.6}
.witem.open .w-more{display:block}
.witem.open .item-name{white-space:normal}
.w-more .ex{background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0}
.flash{min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.flash .fw{font-size:32px;font-weight:800;letter-spacing:-.02em}
.flash .fm{font-size:19px;font-weight:700;background:var(--hl);color:var(--hl-ink);padding:2px 8px;border-radius:6px}
.flash .fe{font-size:14px;line-height:1.6;margin-top:6px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .again{color:var(--loop)}.grade .good{color:var(--ok)}

/* talk */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.sc{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.sc b{font-size:15px}.sc span{font-size:12.5px;color:var(--sub);line-height:1.4}
.msgs{display:flex;flex-direction:column;gap:10px;padding:6px 0 12px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.55;font-size:15.5px}
.msg.user{align-self:flex-end;background:var(--pri);color:var(--pri-ink);border-bottom-right-radius:5px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.note{align-self:center;color:var(--sub);font-size:13px;text-align:center;padding:4px}
.msg.typing{color:var(--sub);font-style:italic}
.msg .ko{font-size:13.5px;color:var(--sub);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.msg-act{display:flex;gap:4px;margin-top:6px}
.msg-act button{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer}
.composer{position:sticky;bottom:-16px;background:var(--bg);padding:8px 0 16px;border-top:1px solid var(--line);margin-bottom:-16px}
.comp-row{gap:8px;margin-top:8px;align-items:flex-end}
.comp-row textarea{flex:1;resize:none;min-height:46px;max-height:120px}
.mic{width:48px;height:48px;border-radius:50%;border:none;background:var(--soft);color:var(--ink);font-size:20px;flex-shrink:0;cursor:pointer}
.mic.rec{background:var(--loop);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.peek{font-size:14px;line-height:1.7;margin-top:8px;max-height:220px;overflow-y:auto}
details summary{cursor:pointer;font-weight:700;font-size:14px}

/* sheet, toast, tabbar */
#sheet{position:fixed;inset:0;background:rgba(16,20,29,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet.open{display:flex}
#sheetBody{background:var(--card);width:100%;max-width:640px;max-height:86%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#sheet{align-items:center}#sheetBody{border-radius:18px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-h h3{margin:0;font-size:22px;letter-spacing:-.01em}
.kv{margin:8px 0;line-height:1.6;font-size:15px}
.kv b{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.add-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.loading{color:var(--sub);padding:18px 0}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;border:none;background:none;padding:8px 0 7px;color:var(--sub);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar button span{font-size:20px;filter:grayscale(1);opacity:.6}
.tabbar button.on{color:var(--ink)}
.tabbar button.on span{filter:none;opacity:1}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav class="tabbar">
    <button data-act="tab" data-v="listen" class="on"><span>🎧</span>듣기</button>
    <button data-act="tab" data-v="words"><span>📒</span>단어장</button>
    <button data-act="tab" data-v="talk"><span>💬</span>AI 회화</button>
    <button data-act="tab" data-v="settings"><span>⚙️</span>설정</button>
  </nav>
</div>
<div id="sheet"><div id="sheetBody"></div></div>
<div id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
'use strict';
/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const audio = $('#audio');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
let toastTimer;
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function showErr(e) { let m = (e && e.message) || '오류가 발생했어요'; if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = '네트워크 연결을 확인해주세요'; toast(m, 4000); console.error(e); }
function loadLS(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
function sleep(ms, tok) { return new Promise(res => { const t0 = Date.now(); const iv = setInterval(() => { if ((tok && tok.cancel) || Date.now() - t0 >= ms) { clearInterval(iv); res(); } }, 50); }); }

/* ---------- settings ---------- */
const S = Object.assign({ apiKey: '', chatModel: 'gpt-4o-mini', voice: 'nova', autoSpeak: true, rate: 1, shRepeat: 2, shGap: 1.3, shShow: true, autoScroll: true }, loadLS('toeic_settings'));
function saveS() { try { localStorage.setItem('toeic_settings', JSON.stringify(S)); } catch (e) {} }
const MODELS = ['gpt-4o-mini', 'gpt-4.1-mini', 'gpt-4o', 'gpt-4.1', 'gpt-5-mini'];
const VOICES = ['nova', 'alloy', 'shimmer', 'echo', 'onyx', 'fable'];
const CATS = { full: '전체', part: '파트별', item: '문항별' };
const LEVELS = { beg: '초급', mid: '중급', adv: '고급' };
const INT = [0, 1, 2, 4, 7, 15, 30];

/* ---------- IndexedDB ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('toeicLab', 1);
  r.onupgradeneeded = () => { const d = r.result; ['files', 'blobs', 'words'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function dbOp(store, mode, fn) { const d = await dbp; return new Promise((res, rej) => { const t = d.transaction(store, mode); const req = fn(t.objectStore(store)); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
const dbAll = s => dbOp(s, 'readonly', st => st.getAll());
const dbGet = (s, k) => dbOp(s, 'readonly', st => st.get(k));
const dbPut = (s, v) => dbOp(s, 'readwrite', st => st.put(v));
const dbDel = (s, k) => dbOp(s, 'readwrite', st => st.delete(k));

/* ---------- OpenAI ---------- */
function needKey() { if (S.apiKey) return true; toast('설정에서 OpenAI API 키를 먼저 입력해주세요', 3000); switchTab('settings'); return false; }
async function oaErr(r) { let m = 'HTTP ' + r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) {} if (r.status === 401) m = 'API 키가 올바르지 않아요. 설정에서 확인해주세요.'; else if (r.status === 429) m = '요청 한도 초과 또는 크레딧 부족: ' + m; return new Error(m); }
async function oaChat(messages, json = false) {
  const body = { model: S.chatModel, messages }; if (json) body.response_format = { type: 'json_object' };
  const r = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.apiKey }, body: JSON.stringify(body) });
  if (!r.ok) throw await oaErr(r);
  const d = await r.json(); return d.choices[0].message.content || '';
}
async function oaJSON(system, user) { const raw = await oaChat([{ role: 'system', content: system + ' Reply ONLY with a valid JSON object.' }, { role: 'user', content: user }], true); return JSON.parse(raw.replace(/```json|```/g, '').trim()); }
async function oaTranscribe(blob, filename, verbose) {
  const fd = new FormData(); fd.append('file', blob, filename); fd.append('model', 'whisper-1'); fd.append('language', 'en');
  if (verbose) { fd.append('response_format', 'verbose_json'); fd.append('timestamp_granularities[]', 'segment'); }
  const r = await fetch('https://api.openai.com/v1/audio/transcriptions', { method: 'POST', headers: { Authorization: 'Bearer ' + S.apiKey }, body: fd });
  if (!r.ok) throw await oaErr(r); return r.json();
}
async function oaTTS(text) {
  const r = await fetch('https://api.openai.com/v1/audio/speech', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.apiKey }, body: JSON.stringify({ model: 'tts-1', voice: S.voice, input: text, response_format: 'mp3' }) });
  if (!r.ok) throw await oaErr(r); return r.blob();
}
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .95; speechSynthesis.speak(u); } catch (e) {} }
const ttsAudio = new Audio(); let ttsUnlocked = false, ttsUrl = null;
function unlockAudio() { if (ttsUnlocked) return; ttsUnlocked = true; ttsAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='; ttsAudio.play().catch(() => {}); }
async function playTTS(text) {
  try { const b = await oaTTS(text); if (ttsUrl) URL.revokeObjectURL(ttsUrl); ttsUrl = URL.createObjectURL(b); ttsAudio.src = ttsUrl; await ttsAudio.play(); }
  catch (e) { if (e && e.name === 'NotAllowedError') toast('🔊 버튼을 눌러 들어보세요'); else { console.warn(e); speak(text); } }
}

/* ---------- state ---------- */
let curTab = 'listen', listenView = 'lib', curCat = 'part', onlyStar = false;
let files = [], words = [], cur = null, objUrl = null, pendingSeek = 0;
let loopA = null, loopB = null, loopSeg = -1, pMode = 'script', lastSegIdx = -1, dragging = false;
let shToken = null, segTok = null, di = 0;
let wTab = 'list', fq = [], fFlipped = false;
let talk = { phase: 'setup', level: 'mid', messages: [] };
let lastLookup = null, lastPara = null, lastFb = null, lastHints = null;
let recorder = null, recChunks = [], recStream = null, recording = false;

/* ---------- sheet ---------- */
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('open'); $('#sheetBody').scrollTop = 0; }
function closeSheet() { $('#sheet').classList.remove('open'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
const sheetClose = '<button class="icon-btn" data-act="closeSheet" aria-label="닫기">✕</button>';

/* ---------- tabs ---------- */
function switchTab(t) {
  if (t !== 'listen') stopModes();
  curTab = t;
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.v === t));
  main.scrollTop = 0;
  if (t === 'listen') (cur && listenView === 'player') ? renderPlayer() : renderLibrary();
  else if (t === 'words') renderWords();
  else if (t === 'talk') renderTalk();
  else renderSettings();
}

/* =========================================================
   LISTEN — library
   ========================================================= */
async function loadFiles() { files = await dbAll('files'); }
const catFiles = c => files.filter(f => f.cat === c).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
function renderLibrary() {
  listenView = 'lib';
  const list = catFiles(curCat).filter(f => !onlyStar || f.star);

async function addFiles(fl) {
  let n = 0; toast('음원을 저장하는 중…', 60000);

    for (const f of fl) {
      const name = f.name.replace(/\.[^.]+$/, '');
      let meta = files.find(x => x.cat === curCat && x.name === name);
      if (meta && meta.hasBlob !== false) continue;
      if (!meta) meta = { id: uid(), cat: curCat, name, added: Date.now(), star: false, lastPos: 0 };
      const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'audio/mpeg' });
      meta.hasBlob = true; meta.size = f.size; meta.type = blob.type;
      await dbPut('blobs', { id: meta.id, blob }); await dbPut('files', meta); n++;
    }
    await loadFiles(); renderLibrary(); toast(n ? `${n}개 추가했어요` : '이미 추가된 파일이에요');
  } catch (e) { showErr(e); }
}
async function deleteFile(id) {

}

/* time & loop UI */
function updateTimeUI() {

}
function updatePlayBtn() { const b = $('#playBtn'); if (b) b.textContent = audio.paused ? '▶' : '❚❚'; }
function updateLoopUI() {

  $('#btnA').classList.toggle('set', loopA != null); $('#btnB').classList.toggle('set', loopB != null);

function curSegIndex() { const segs = cur?.transcript?.segments; if (!segs) return -1; const t = audio.currentTime; let k = -1; for (let i = 0; i < segs.length; i++) { if (segs[i].start <= t + 0.05) k = i; else break; } return k; }
function highlightSeg(force) {

}
function seekBy(s) { audio.currentTime = Math.max(0, Math.min((audio.duration || 0), audio.currentTime + s)); updateTimeUI(); }
function togglePlay() { if (!audio.src) return toast('음원 파일이 없어요'); if (audio.paused) audio.play().catch(showErr); else audio.pause(); }
function setA() { stopModes(); loopA = audio.currentTime; loopB = null; loopSeg = -1; updateLoopUI(); toast(`구간 시작 ${fmt(loopA)}`, 1200); }
function setB() {
  if (loopA == null) return toast('먼저 [ 시작 지점을 찍어주세요');
  if (audio.currentTime <= loopA + 0.3) return toast('종료 지점은 시작보다 뒤여야 해요');
  loopB = audio.currentTime; audio.currentTime = loopA; audio.play().catch(() => {}); updateLoopUI();
}
function clearLoop() { loopA = loopB = null; loopSeg = -1; updateLoopUI(); }
function segLoop(i) {
  stopModes();
  if (loopSeg === i) { clearLoop(); return; }
  const s = cur.transcript.segments[i]; loopA = s.start; loopB = s.end; loopSeg = i;
  audio.currentTime = s.start; audio.play().catch(() => {}); updateLoopUI();
}
function saveProgress() { if (cur && audio.src && audio.currentTime > 0) { cur.lastPos = audio.currentTime; dbPut('files', cur).catch(() => {}); } }
function setMediaSession() {
  if (!('mediaSession' in navigator) || !cur) return;
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: cur.name, artist: 'TOEIC Lab · ' + CATS[cur.cat] });
    navigator.mediaSession.setActionHandler('seekbackward', () => seekBy(-5)); navigator.mediaSession.setActionHandler('seekforward', () => seekBy(5)); } catch (e) {}
}
function moveFile(d) { const l = catFiles(cur.cat); const i = l.findIndex(f => f.id === cur.id) + d; if (i < 0 || i >= l.length) return toast(d < 0 ? '첫 번째 파일이에요' : '마지막 파일이에요'); openPlayer(l[i].id); }

audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek && pendingSeek < audio.duration - 1) audio.currentTime = pendingSeek; pendingSeek = 0;
  if (cur && (!cur.duration || Math.abs(cur.duration - audio.duration) > 1)) { cur.duration = audio.duration; dbPut('files', cur); }
  audio.playbackRate = S.rate; updateTimeUI();
});
audio.addEventListener('play', () => { audio.playbackRate = S.rate; updatePlayBtn(); });
audio.addEventListener('pause', () => { updatePlayBtn(); saveProgress(); });
audio.addEventListener('ended', updatePlayBtn);
setInterval(() => { if (!audio.paused) saveProgress(); }, 5000);
(function tick() {
  if (!audio.paused) {
    if (loopA != null && loopB != null && audio.currentTime >= loopB) audio.currentTime = loopA;
    updateTimeUI(); highlightSeg();
  }
  requestAnimationFrame(tick);
})();

/* transcript generation */
function extOf(type) { if (/mp4|m4a|aac/.test(type)) return 'm4a'; if (/wav/.test(type)) return 'wav'; if (/webm/.test(type)) return 'webm'; if (/ogg/.test(type)) return 'ogg'; return 'mp3'; }
async function genTranscript() {
  if (!needKey()) return;
  if (cur.transcript && !confirm('스크립트를 다시 만들까요? (API 비용이 다시 들어요)')) return;
  const rec = await dbGet('blobs', cur.id); if (!rec) return toast('음원 파일이 없어요');
  if (rec.blob.size > 25 * 1024 * 1024) return openSheet(`<div class="sheet-h"><h3>파일이 25MB를 넘어요</h3>${sheetClose}</div><p class="sub">OpenAI 음성 인식은 파일당 25MB까지 가능해요. 전체 음원 대신 파트별·문항별 음원으로 스크립트를 만들어주세요.</p>`);
  const b = $('#genBtn'); if (b) { b.disabled = true; b.textContent = '만드는 중… (1~2분)'; } toast('AI가 음원을 듣고 있어요…', 60000);
  try {
    const d = await oaTranscribe(rec.blob, 'audio.' + extOf(rec.blob.type), true);
    const segments = (d.segments || []).map(s => ({ start: +s.start, end: +s.end, text: String(s.text).trim() })).filter(s => s.text);
    if (!segments.length && d.text) segments.push({ start: 0, end: audio.duration || 0, text: d.text.trim() });
    cur.transcript = { segments, created: Date.now() }; await dbPut('files', cur);
    pMode = pMode || 'script'; renderPlayer(); toast('스크립트를 만들었어요');
  } catch (e) { showErr(e); if (b) { b.disabled = false; b.textContent = '📝 스크립트 만들기'; } }
}

/* word lookup & paraphrase */
const cleanWord = w => w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, '').replace(/'s$/i, '');
function wordCardHtml(j) {
  return `${j.pos ? `<div class="pos" style="margin:0 0 6px">${esc(j.pos)}</div>` : ''}

  ${j.synonyms && j.synonyms.length ? `<div class="kv"><b>바꿔 쓸 수 있는 표현</b>${j.synonyms.map(esc).join(', ')}</div>` : ''}
  ${j.context ? `<div class="kv"><b>나온 문장</b><span class="sub">${esc(j.context)}</span></div>` : ''}`;
}
async function lookupWord(raw, context) {

  openSheet(`<div class="sheet-h"><h3>${esc(word)}</h3><div class="row"><button class="icon-btn" data-act="speak" data-t="${esc(word)}">🔊</button>${sheetClose}</div></div><div id="wl" class="loading">뜻을 찾는 중…</div>`);
  if (!S.apiKey) { $('#wl').outerHTML = `<p class="sub">API 키가 없어 AI 뜻 풀이를 할 수 없어요. 뜻을 직접 입력해서 저장할 수 있어요.</p><input id="manMean" placeholder="뜻 입력"><button class="btn primary block" data-act="addManual" data-w="${esc(word)}" data-c="${esc(context || '')}">＋ 단어장에 추가</button>`; return; }
  try {
    const j = await oaJSON('You are a TOEIC vocabulary tutor for Korean learners.',
      `Word or expression: "${word}"\n${context ? `Context sentence: "${context}"\n` : ''}Return JSON with keys: "word" (dictionary/base form), "pos" (part of speech in Korean, e.g. 명사/동사/형용사/표현), "meaning" (concise Korean meaning${context ? ' that fits the context' : ''}), "toeic" (one short Korean sentence on how it appears in TOEIC), "example" (short business-English example), "example_ko" (Korean translation), "synonyms" (array of up to 3 English paraphrases).`);

  } catch (e) { const el = $('#wl'); if (el) el.textContent = e.message; }

async function paraphrase(i) {

      `Sentence from a TOEIC listening script: "${text}"\nReturn JSON: "ko" (natural Korean translation), "paraphrases" (array of 3 objects {"en","ko"} that keep the meaning using different words, as TOEIC answer choices would), "expressions" (array of up to 4 objects {"expr","meaning"} for useful words/phrases in the sentence, meaning in Korean).`);
    lastPara = j;

/* shadowing */
function playSeg(s, tok) {
  return new Promise(res => {
    audio.currentTime = s.start; audio.play().catch(() => {});
    const chk = () => { if (tok.cancel) return res(); if (audio.currentTime >= s.end - 0.04 || audio.ended) { audio.pause(); return res(); } requestAnimationFrame(chk); };
    requestAnimationFrame(chk);
  });
}
function stopModes() { if (shToken) { shToken.cancel = true; shToken = null; audio.pause(); } if (segTok) { segTok.cancel = true; segTok = null; } }
function shState(i, phase, r) {
  const b = $('#shBox'); if (!b) return; const segs = cur.transcript.segments, s = segs[i];
  b.innerHTML = `<div class="sh-meta">문장 ${i + 1} / ${segs.length} · ${r} / ${S.shRepeat}회</div>
    <div class="sh-phase ${phase}">${phase === 'listen' ? '🎧 듣기' : '🗣 따라 말하기'}</div>
    <div class="sh-text">${S.shShow ? esc(s.text) : '<span class="sub">문장 숨김</span>'}</div>`;
}
async function startShadow(fromCur) {
  stopModes(); clearLoop();
  const segs = cur.transcript.segments; let i = fromCur ? Math.max(0, curSegIndex()) : 0;
  const tok = { cancel: false }; shToken = tok;
  for (; i < segs.length && !tok.cancel; i++) {
    for (let r = 1; r <= S.shRepeat && !tok.cancel; r++) {
      shState(i, 'listen', r); await playSeg(segs[i], tok); if (tok.cancel) break;
      shState(i, 'speak', r); await sleep((segs[i].end - segs[i].start) / S.rate * S.shGap * 1000 + 400, tok);
    }
  }
  if (!tok.cancel) { shToken = null; const b = $('#shBox'); if (b) b.innerHTML = '<div class="sh-text">🎉 끝까지 따라 했어요</div>'; }
}

/* dictation */
function renderDict() {

  box.innerHTML = `<div class="card">

  <div class="card"><h3>AI 설정</h3>
    <label class="lbl" for="modelSel">대화·해설 모델</label><select id="modelSel">${MODELS.map(m => `<option ${m === S.chatModel ? 'selected' : ''}>${m}</option>`).join('')}</select>
    <p class="sub" style="font-size:12.5px;margin:4px 0 0">gpt-4o-mini가 가장 저렴하고 충분히 좋아요.</p>
    <label class="lbl" for="voiceSel">회화 상대 목소리</label><select id="voiceSel">${VOICES.map(v => `<option ${v === S.voice ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <button class="btn sm" data-act="testVoice" style="margin-top:8px">🔊 목소리 들어보기</button></div>
  <div class="card"><h3>백업과 기기 간 옮기기</h3><p class="sub" style="margin-top:0">단어장, 스크립트, 북마크를 파일로 내보내고 다른 기기에서 가져올 수 있어요. 음원 파일은 기기마다 따로 추가해주세요(이름이 같으면 스크립트가 자동 연결돼요).</p>
    <div class="row gap"><button class="btn" data-act="export">내보내기</button><label class="btn">가져오기<input type="file" id="importIn" accept=".json,application/json" hidden></label></div></div>
  <div class="card"><h3>저장 공간</h3><div id="usage" class="sub">계산 중…</div></div>
  <div class="card"><h3>노트북 키보드 단축키</h3><p class="sub" style="margin:0">Space 재생/정지 · [ 구간 시작 · ] 구간 종료 · \\ 구간 해제<br>← → 5초 이동 · ↑ ↓ 속도 조절</p></div>
  <div class="card"><h3>홈 화면에 추가</h3><p class="sub" style="margin:0">아이폰 Safari: 공유 버튼 → 홈 화면에 추가<br>노트북 Chrome·Edge: 주소창의 설치 아이콘 또는 즐겨찾기</p></div>
  <div class="card"><button class="btn ghost" data-act="wipe" style="color:var(--loop)">이 기기의 모든 데이터 삭제</button></div>`;
  try { const e = await navigator.storage.estimate(); const u = $('#usage'); if (u) u.textContent = `사용 중 ${(e.usage / 1048576).toFixed(1)}MB · 음원 ${files.filter(f => f.hasBlob !== false).length}개 · 단어 ${words.length}개`; } catch (e) { const u = $('#usage'); if (u) u.textContent = `음원 ${files.length}개 · 단어 ${words.length}개`; }
}
async function exportData() {
  const data = { app: 'toeic-lab', version: 1, exported: new Date().toISOString(), files: await dbAll('files'), words: await dbAll('words') };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `toeic-lab-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function importData(file) {
  try {
    const data = JSON.parse(await file.text()); if (data.app !== 'toeic-lab') throw new Error('TOEIC Lab 백업 파일이 아니에요');
    let nf = 0, nw = 0;
    for (const m of data.files || []) {
      const ex = files.find(f => f.cat === m.cat && f.name === m.name);
      if (ex) { if (m.transcript && !ex.transcript) { ex.transcript = m.transcript; nf++; } ex.star = ex.star || m.star; await dbPut('files', ex); }
      else { await dbPut('files', Object.assign({}, m, { hasBlob: false, lastPos: 0 })); nf++; }
    }
    for (const w of data.words || []) {
      const ex = words.find(x => x.word.toLowerCase() === w.word.toLowerCase());
      if (!ex) { await dbPut('words', w); nw++; } else if ((w.updated || 0) > (ex.updated || 0)) await dbPut('words', Object.assign({}, w, { id: ex.id }));
    }
    await loadFiles(); words = await dbAll('words'); toast(`가져오기 완료: 음원·스크립트 ${nf}개, 단어 ${nw}개`, 3000); renderSettings();
  } catch (e) { showErr(e); }
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, i = +el.dataset.i;
  try {
    switch (a) {
      case 'tab': switchTab(v); break;
      case 'closeSheet': closeSheet(); break;
      case 'speak': e.stopPropagation(); speak(el.dataset.t); break;
      /* library */
      case 'cat': curCat = v; renderLibrary(); break;
      case 'starFilter': onlyStar = !onlyStar; renderLibrary(); break;
      case 'open': openPlayer(el.dataset.id); break;
      case 'del': e.stopPropagation(); deleteFile(el.dataset.id); break;
      /* player */
      case 'back': stopModes(); renderLibrary(); main.scrollTop = 0; break;
      case 'star': cur.star = !cur.star; await dbPut('files', cur); el.classList.toggle('on', cur.star); break;
      case 'play': stopModes(); togglePlay(); break;
      case 'seekBy': seekBy(+v); break;
      case 'prevFile': moveFile(-1); break;
      case 'nextFile': moveFile(1); break;
      case 'setA': setA(); break;
      case 'setB': setB(); break;
      case 'clearLoop': clearLoop(); break;
      case 'mode': stopModes(); pMode = v; document.querySelectorAll('[data-act=mode]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); renderMode(); break;
      case 'genTr': genTranscript(); break;
      case 'segLoop': segLoop(i); break;
      case 'word': lookupWord(el.textContent, cur.transcript.segments[i].text); break;
      case 'para': paraphrase(i); break;
      case 'addLookup': if (lastLookup) { await addWord(lastLookup); closeSheet(); } break;
      case 'addManual': await addWord({ word: el.dataset.w, meaning: $('#manMean').value, context: el.dataset.c }); closeSheet(); break;
      case 'addExpr': { const x = lastPara.expressions[+el.dataset.k]; await addWord({ word: x.expr, meaning: x.meaning, pos: '표현', context: el.dataset.c }); el.disabled = true; el.textContent = '추가됨'; break; }
      case 'shStart': startShadow(v === 'cur'); break;
      case 'shStop': stopModes(); break;
      case 'dNav': di += +v; renderDict(); break;
      case 'dPlay': { stopModes(); clearLoop(); const tok = { cancel: false }; segTok = tok; await playSeg(cur.transcript.segments[di], tok); break; }
      case 'dCheck': {
        const ref = cur.transcript.segments[di].text, hyp = $('#dIn').value;
        if (!hyp.trim()) return toast('들은 내용을 먼저 입력해주세요');
        const r = diffWords(ref, hyp);
        $('#dRes').innerHTML = `<div class="row between" style="margin-top:14px"><span class="score">${r.score}점</span><span class="sub" style="font-size:12.5px"><span class="d-miss" style="padding:0 4px;border-radius:4px">빨강</span> 놓친 단어 · <span class="d-extra">취소선</span> 잘못 쓴 단어</span></div>
          <div class="diff">${r.ops.map(([t, w]) => `<span class="${t === 'eq' ? '' : 'd-' + t}">${esc(w)}</span>`).join(' ')}</div>
          <div class="kv" style="margin-top:10px"><b>정답 (단어를 탭하면 뜻)</b>${segWordsHtml(di)}</div>`;
        break;
      }
      case 'dShow': $('#dRes').innerHTML = `<div class="kv" style="margin-top:14px"><b>정답 (단어를 탭하면 뜻)</b>${segWordsHtml(di)}</div>`; break;
      /* words */
      case 'wTab': wTab = v; if (v === 'flash') { fq = []; fFlipped = false; } renderWords(); break;
      case 'wAdd': { const w = $('#wNew').value.trim(); if (!w) return toast('단어를 입력해주세요'); lookupWord(w, ''); break; }
      case 'wItem': el.classList.toggle('open'); break;
      case 'wDel': e.stopPropagation(); { const w = words.find(x => x.id === el.dataset.id); if (w && confirm(`"${w.word}"을(를) 삭제할까요?`)) { await dbDel('words', w.id); words = words.filter(x => x.id !== w.id); renderWords(); } } break;
      case 'fStart': { const now = Date.now(); fq = words.filter(w => w.due <= now).sort(() => Math.random() - .5); fFlipped = false; renderWords(); break; }
      case 'fFlip': if (!fFlipped) { fFlipped = true; renderWords(); } break;
      case 'fGrade': await grade(+v); break;
      /* talk */
      case 'lvl': talk.level = v; renderTalkSetup(); break;
      case 'startSc': { const s = SCENARIOS.find(x => x.id === el.dataset.id); startTalk({ mode: 'sc', title: s.t, prompt: s.p }); break; }
      case 'startCustom': { const t = $('#customSc').value.trim(); if (!t) return toast('상황을 입력해주세요'); startTalk({ mode: 'sc', title: t, prompt: `The situation (described by a Korean learner): "${t}". Choose a suitable role for yourself.` }); break; }
      case 'startRole': { const f = files.find(x => x.id === $('#rpFile').value); startTalk({ mode: 'role', title: f.name, script: f.transcript.segments.map(s => s.text).join('\n'), role: $('#rpRole').value }); break; }
      case 'talkNew': if (recording && recorder) recorder.stop(); talk = { phase: 'setup', level: talk.level, messages: [] }; renderTalk(); break;
      case 'mic': toggleRec(); break;
      case 'send': { unlockAudio(); const t = $('#talkIn'); sendUser(t.value); t.value = ''; break; }
      case 'hint': showHint(); break;
      case 'useHint': { const t = $('#talkIn'); if (t) t.value = lastHints[+el.dataset.k].en; closeSheet(); break; }
      case 'feedback': showFeedback(); break;
      case 'tts': unlockAudio(); playTTS(talk.messages[i].content); break;
      case 'trMsg': { el.disabled = true; const m = talk.messages[i]; m.ko = await oaChat([{ role: 'system', content: 'Translate the English into natural Korean. Output only the translation.' }, { role: 'user', content: m.content }]); renderMsgs(); break; }
      case 'addFb': { const k = +el.dataset.k; const x = el.dataset.t === 'c' ? { word: lastFb.corrections[k].better, meaning: lastFb.corrections[k].why, pos: '표현' } : { word: lastFb.expressions[k].expr, meaning: lastFb.expressions[k].meaning, pos: '표현' }; await addWord(x); el.disabled = true; el.textContent = '✓'; break; }
      /* settings */
      case 'toggleKey': { const k = $('#keyIn'); k.type = k.type === 'password' ? 'text' : 'password'; el.textContent = k.type === 'password' ? '보기' : '숨기기'; break; }
      case 'saveKey': S.apiKey = $('#keyIn').value.trim(); saveS(); toast(S.apiKey ? 'API 키를 저장했어요' : 'API 키를 지웠어요'); break;
      case 'testKey': {
        S.apiKey = $('#keyIn').value.trim(); saveS(); if (!S.apiKey) return toast('키를 입력해주세요');
        el.disabled = true; el.textContent = '확인 중…';
        const r = await fetch('https://api.openai.com/v1/models', { headers: { Authorization: 'Bearer ' + S.apiKey } });
        el.disabled = false; el.textContent = '연결 테스트';
        if (r.ok) toast('✅ 연결 성공! AI 기능을 쓸 수 있어요'); else throw await oaErr(r); break;
      }
      case 'testVoice': if (!needKey()) return; unlockAudio(); playTTS('Hello! Shall we practice for the TOEIC together today?'); break;
      case 'export': exportData(); break;
      case 'wipe':
        if (!confirm('이 기기의 음원, 스크립트, 단어장이 모두 삭제돼요. 계속할까요?') || !confirm('정말 삭제할까요? 되돌릴 수 없어요.')) return;
        audio.pause(); cur = null; for (const s of ['files', 'blobs', 'words']) await dbOp(s, 'readwrite', st => st.clear());
        files = []; words = []; toast('모두 삭제했어요'); renderSettings(); break;
    }
  } catch (err) { showErr(err); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileIn' && t.files.length) addFiles(t.files);
  else if (t.id === 'attachIn' && t.files[0]) (async () => {
    const f = t.files[0]; const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'audio/mpeg' });
    await dbPut('blobs', { id: cur.id, blob }); cur.hasBlob = true; await dbPut('files', cur);
    const id = cur.id; cur = null; await loadFiles(); openPlayer(id); toast('음원을 연결했어요');
  })().catch(showErr);
  else if (t.id === 'importIn' && t.files[0]) importData(t.files[0]);
  else if (t.id === 'seek') { const d = audio.duration || 0; if (d) audio.currentTime = t.value / 1000 * d; dragging = false; }
  else if (t.id === 'autoScroll') { S.autoScroll = t.checked; saveS(); }
  else if (t.id === 'shRep') { S.shRepeat = +t.value; saveS(); }
  else if (t.id === 'shGap') { S.shGap = +t.value; saveS(); }
  else if (t.id === 'shShow') { S.shShow = t.checked; saveS(); }
  else if (t.id === 'autoSpeak') { S.autoSpeak = t.checked; saveS(); }
  else if (t.id === 'modelSel') { S.chatModel = t.value; saveS(); toast('모델을 바꿨어요'); }
  else if (t.id === 'voiceSel') { S.voice = t.value; saveS(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'seek') { dragging = true; const d = audio.duration || 0; $('#tCur').textContent = fmt(t.value / 1000 * d); }
  else if (t.id === 'rate') { S.rate = Math.round(+t.value * 10) / 10; audio.playbackRate = S.rate; $('#rateLbl').textContent = S.rate.toFixed(1) + '×'; saveS(); }
  else if (t.id === 'wSearch') { const q = t.value.toLowerCase().trim(); document.querySelectorAll('.witem').forEach(it => it.style.display = !q || it.dataset.s.includes(q) ? '' : 'none'); }
  else if (t.id === 'talkIn') { t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.target.id === 'talkIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); unlockAudio(); sendUser(e.target.value); e.target.value = ''; return; }
  if (e.target.id === 'wNew' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); const w = e.target.value.trim(); if (w) lookupWord(w, ''); return; }
  if (e.key === 'Escape') closeSheet();
  if (['input', 'textarea', 'select'].includes(tag) && e.target.type !== 'range') return;
  if (curTab !== 'listen' || listenView !== 'player' || !cur) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); stopModes(); togglePlay(); }
  else if (k === '[') setA();
  else if (k === ']') setB();
  else if (k === '\\') clearLoop();
  else if (k === 'ArrowLeft') { e.preventDefault(); seekBy(-5); }
  else if (k === 'ArrowRight') { e.preventDefault(); seekBy(5); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault(); S.rate = Math.min(2, Math.max(1, Math.round((S.rate + (k === 'ArrowUp' ? .1 : -.1)) * 10) / 10));
    audio.playbackRate = S.rate; saveS(); const r = $('#rate'); if (r) { r.value = S.rate; $('#rateLbl').textContent = S.rate.toFixed(1) + '×'; } toast(`속도 ${S.rate.toFixed(1)}×`, 900);
  }
});
window.addEventListener('pagehide', saveProgress);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

/* ---------- init ---------- */
(function makeIcon() {
  try { const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#1B2A4A'; x.fillRect(0, 0, 180, 180); x.fillStyle = '#FFE066'; x.fillRect(28, 104, 124, 26);
    x.fillStyle = '#FFFFFF'; x.font = 'bold 54px -apple-system, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('TOEIC', 90, 76);
    x.fillStyle = '#1B2A4A'; x.font = 'bold 22px -apple-system, sans-serif'; x.fillText('LAB', 90, 118);
    $('#touchIcon').href = c.toDataURL('image/png'); } catch (e) {}
})();
(async function init() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { await loadFiles(); words = await dbAll('words'); } catch (e) { showErr(e); }
  switchTab('listen');
})();
</script>
